<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Пожертвования Батумскому храму ИСККОН</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f2e9;
        font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #1f1f1f;
        padding: 16px;
      }

      .card {
        width: min(600px, calc(100vw - 32px));
        max-width: 580px;
        background: #ffffff;
        padding: 32px 28px;
        border-radius: 18px;
        box-shadow: 0 12px 35px rgba(33, 33, 52, 0.08);
        text-align: center;
      }

      .card__overline {
        margin: 0 0 12px;
        font-size: 14px;
        letter-spacing: 0.01em;
        color: #60616a;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 28px;
        line-height: 1.3;
      }

      .subtitle {
        margin: 0;
        font-size: 17px;
        line-height: 1.6;
        color: #3c3d45;
      }

      @media (max-width: 480px) {
        .card {
          padding: 28px 22px;
        }

        h1 {
          font-size: 24px;
        }

        .subtitle {
          font-size: 15px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="card__overline">Батумский храм Международного общества сознания Кришны (ИСККОН)</p>
      <h1>Пожертвования Батумскому храму ИСККОН</h1>
      <p class="subtitle">
        Вы можете поддержать храм удобным для вас способом. Пожалуйста, выберите вариант
        пожертвования ниже.
      </p>
    </main>
  </body>
</html>
